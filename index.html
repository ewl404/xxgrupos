    *, *::before, *::after {

    /* ── Card ── */
    .card {
      width: 100%;
      max-width: 420px;
      background: #171717;
      border: 1px solid #262626;
      border-radius: 16px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, .6),
                  0 0 80px rgba(220, 38, 38, .06);
      overflow: hidden;
      animation: slideUp .6s cubic-bezier(.22, 1, .36, 1) both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Progress bar ── */
    .progress-track {
      height: 5px;
      width: 100%;
      background: #262626;
    }

    .progress-fill {
      height: 100%;
      width: 50%;
      background: #dc2626;
      border-radius: 0 4px 4px 0;
      transition: width .5s ease-out;
    }

    /* ── Inner content ── */
    .card-body {
      padding: 32px;
      text-align: center;
    }

    @media (min-width: 640px) {
      .card-body {
        padding: 40px;
      }
    }

    /* ── Icon circle ── */
    .icon-wrapper {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(220, 38, 38, .1);
      margin-bottom: 12px;
      animation: pulse-glow 2.4s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, .25); }
      50%      { box-shadow: 0 0 24px 4px rgba(220, 38, 38, .15); }
    }

    .icon-wrapper svg {
      width: 36px;
      height: 36px;
      color: #ef4444;
    }

    /* ── Typography ── */
    .title {
      font-size: 1.55rem;
      font-weight: 900;
      line-height: 1.2;
      letter-spacing: -.02em;
      margin-top: 20px;
    }

    @media (min-width: 640px) {
      .title {
        font-size: 1.85rem;
      }
    }

    .subtitle {
      color: #a3a3a3;
      font-size: 1.05rem;
      line-height: 1.55;
      margin-top: 12px;
    }

    /* ── Button ── */
    .btn-confirm {
      display: block;
      width: 100%;
      margin-top: 28px;
      padding: 16px 24px;
      border: none;
      border-radius: 12px;
      background: #dc2626;
      color: #fff;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .06em;
      cursor: pointer;
      transition: background .2s, transform .15s, box-shadow .25s;
      box-shadow: 0 0 20px rgba(220, 38, 38, .3);
    }

    .btn-confirm:hover {
      background: #b91c1c;
      transform: scale(1.02);
      box-shadow: 0 0 32px rgba(220, 38, 38, .45);
    }

    .btn-confirm:active {

    /* ── Loader overlay while translating ── */
    .loader-overlay {
      position: fixed;
      inset: 0;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      transition: opacity .4s;

      pointer-events: none;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #262626;
      border-top-color: #dc2626;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ─────────────────────────────────────────────
       Apply translations
       ───────────────────────────────────────────── */
    function applyTranslation(lang) {
      const t = translations[lang] || translations.en;
      document.getElementById("title").textContent = t.title;
      document.getElementById("subtitle").textContent = t.subtitle;
      document.getElementById("btn").textContent = t.button;
      document.documentElement.lang = lang;

      /* RTL support for Arabic / Hebrew */
      if (lang === "ar" || lang === "he") {
        document.documentElement.dir = "rtl";
      }
    }

    /* ─────────────────────────────────────────────
       Detect language from IP via free geo API
       ───────────────────────────────────────────── */
    async function detectAndTranslate() {
      const loader = document.getElementById("loader");

      try {
        /* Try multiple free IP geolocation services as fallbacks */
        let countryCode = null;

        try {
          const res = await fetch("https://ipapi.co/json/", { signal: AbortSignal.timeout(4000) });
          if (res.ok) {
            const data = await res.json();
            countryCode = data.country_code || data.country;
          }
        } catch (_) { /* fallback below */ }

        if (!countryCode) {
          try {
            const res = await fetch("https://ip2c.org/s", { signal: AbortSignal.timeout(4000) });
            if (res.ok) {
              const text = await res.text();
              const parts = text.split(";");
              if (parts[0] === "1") countryCode = parts[1];
            }
          } catch (_) { /* use default */ }
        }

        if (countryCode) {
          const lang = countryToLang[countryCode.toUpperCase()] || "en";
          applyTranslation(lang);
        }
      } catch (_) {
        /* Network error – stays English */
      } finally {
        loader.classList.add("hidden");
        setTimeout(() => loader.remove(), 500);
      }
    }

    detectAndTranslate();

    /* ─────────────────────────────────────────────
       Button click — redirect placeholder
       ───────────────────────────────────────────── */
    document.getElementById("btn").addEventListener("click", function () {
