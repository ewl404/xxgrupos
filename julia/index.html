    *, *::before, *::after {

      min-height: 100vh;
      background-color: #0a0a0a;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Card ── */
    .card {
      width: 100%;
      max-width: 420px;
      background: #171717;
      border: 1px solid #262626;
      border-radius: 16px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, .6),
                  0 0 80px rgba(220, 38, 38, .06);
      overflow: hidden;
      animation: slideUp .6s cubic-bezier(.22, 1, .36, 1) both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Progress bar ── */
    .progress-track {
      height: 6px;
      width: 100%;
      background: #262626;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 50%;
      background: #dc2626;
      border-radius: 0 4px 4px 0;
      transition: width .6s cubic-bezier(.34, 1.3, .64, 1), background-color .4s ease;
    }

    .progress-fill.completed {
      width: 100%;
      background: #16a34a;
    }

    /* ── Inner content ── */
    .card-body {
      padding: 36px 24px;
      text-align: center;
    }

    @media (min-width: 640px) {
      .card-body {
        padding: 42px 32px;
      }
    }

    /* ── Icon circle ── */
    .icon-wrapper {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: rgba(220, 38, 38, .12);
      margin-bottom: 12px;
      animation: pulse-glow 2.4s ease-in-out infinite;
      transition: all .5s cubic-bezier(.34, 1.2, .64, 1);
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, .28); }
      50%      { box-shadow: 0 0 26px 4px rgba(220, 38, 38, .18); }
    }

    @keyframes pulse-glow-green {
      0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, .32); }
      50%      { box-shadow: 0 0 28px 6px rgba(34, 197, 94, .24); }
    }

    .icon-wrapper.verified {
      background: rgba(22, 163, 74, .16);
      animation: pulse-glow-green 2s ease-in-out infinite;
    }

    .icon-wrapper svg {
      width: 38px;
      height: 38px;
      color: #ef4444;
      transition: all .4s ease;
    }

    .icon-wrapper.verified svg {
      color: #22c55e;
    }

    /* ── Typography ── */
    .title {
      font-size: 1.55rem;
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: -.02em;
      margin-top: 16px;
      transition: opacity .3s, transform .3s;
    }

    @media (min-width: 640px) {
      .title {
        font-size: 1.85rem;
      }
    }

    .subtitle {
      color: #a3a3a3;
      font-size: 1.02rem;
      line-height: 1.55;
      margin-top: 12px;
      transition: opacity .3s, transform .3s;
    }

    /* ── Buttons ── */
    .btn-action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      margin-top: 24px;
      padding: 16px 24px;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .06em;
      cursor: pointer;
      transition: all .25s ease;
    }

    /* Red Primary Button (Step 1) */
    .btn-red {
      background: #dc2626;
      color: #fff;
      box-shadow: 0 0 22px rgba(220, 38, 38, .35);
      animation: pulse-button-red 2.2s infinite;
    }

    @keyframes pulse-button-red {
      0%, 100% {
        box-shadow: 0 0 20px rgba(220, 38, 38, .35);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 32px rgba(220, 38, 38, .55);
        transform: scale(1.015);
      }
    }

    .btn-red:hover {
      background: #b91c1c;
      transform: scale(1.025);
      box-shadow: 0 0 36px rgba(220, 38, 38, .6);
    }

    .btn-red:active {
      transform: scale(.97);
    }

    /* Green Action Button (Step 2) */
    .btn-green {
      background: #16a34a;
      color: #ffffff;
      box-shadow: 0 0 24px rgba(22, 163, 74, .45);
      animation: pulse-button-green 2.2s infinite;
    }

    @keyframes pulse-button-green {
      0%, 100% {
        box-shadow: 0 0 20px rgba(22, 163, 74, .38);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 34px rgba(34, 197, 94, .6);
        transform: scale(1.02);
      }
    }

    .btn-green:hover {
      background: #15803d;
      transform: scale(1.025);
      box-shadow: 0 0 36px rgba(34, 197, 94, .65);
    }

    .btn-green:active {
      transform: scale(.97);
    }

    .step2-wrapper {
      margin-top: 16px;
      animation: fadeInStep2 .45s cubic-bezier(.22, 1, .36, 1) both;

    @keyframes fadeInStep2 {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }

      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 18px;
      background: rgba(22, 163, 74, 0.16);
      border: 1px solid rgba(34, 197, 94, 0.4);
      border-radius: 10px;
      color: #4ade80;
      font-size: 0.98rem;
      font-weight: 700;
      width: 100%;
      justify-content: center;
      box-sizing: border-box;
      margin-bottom: 6px;

      inset: 0;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      transition: opacity .4s;

      pointer-events: none;

      width: 36px;
      height: 36px;
      border: 3px solid #262626;
      border-top-color: #dc2626;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

      to { transform: rotate(360deg); }
    }

    /* Country code to language mapping */
    const countryToLang = {
      US: "en", GB: "en", UK: "en", CA: "en", AU: "en", NZ: "en", IE: "en", ZA: "en",
      BR: "pt", PT: "pt", AO: "pt", MZ: "pt", CV: "pt",
      ES: "es", MX: "es", AR: "es", CO: "es", CL: "es", PE: "es", VE: "es",
      EC: "es", GT: "es", CU: "es", BO: "es", DO: "es", HN: "es", PY: "es",
      SV: "es", NI: "es", CR: "es", PA: "es", UY: "es",
      FR: "fr", BE: "fr", CH: "fr", SN: "fr", CI: "fr", ML: "fr",
      CM: "fr", MG: "fr", NE: "fr", BF: "fr", TD: "fr", GN: "fr", RW: "fr",
      HT: "fr", TG: "fr", CG: "fr", CD: "fr", GA: "fr", DJ: "fr", KM: "fr",
      DE: "de", AT: "de", LI: "de",
      IT: "it", SM: "it", VA: "it",
      RU: "ru", BY: "ru", KZ: "ru", KG: "ru",
      JP: "ja",
      KR: "ko",
      CN: "zh", TW: "zh", HK: "zh", MO: "zh", SG: "zh",
      SA: "ar", EG: "ar", IQ: "ar", MA: "ar", DZ: "ar", SD: "ar", YE: "ar",
      SY: "ar", TN: "ar", JO: "ar", LY: "ar", LB: "ar", AE: "ar", OM: "ar",
      KW: "ar", QA: "ar", BH: "ar", PS: "ar",
      IN: "hi",
      TR: "tr",
      PL: "pl",
      NL: "nl",
      TH: "th",
      VN: "vi",
      ID: "id",
      UA: "uk",
      CZ: "cs",
      RO: "ro",
      SE: "sv",
      DK: "da",
      FI: "fi",
      NO: "no",
      HU: "hu",
      GR: "el", CY: "el",
      BG: "bg",
      MY: "ms",
      IL: "he"
    };

    function getBrowserLanguage() {
      const nav = (navigator.language || navigator.userLanguage || "en").toLowerCase();
      const code = nav.split("-")[0];
      return translations[code] ? code : "en";
    }

    let activeLang = getBrowserLanguage();
    let isStep2 = false;

    function applyTranslation(lang) {
      activeLang = translations[lang] ? lang : "en";
      const t = translations[activeLang];
      document.title = isStep2 ? t.title2 : t.title1;
      document.documentElement.lang = activeLang;

      if (activeLang === "ar" || activeLang === "he") {
        document.documentElement.dir = "rtl";
      } else {
        document.documentElement.dir = "ltr";
      }

      if (!isStep2) {
        document.getElementById("title").textContent = t.title1;
        document.getElementById("subtitle").textContent = t.subtitle1;
        document.getElementById("btn-step1-text").textContent = t.btn1;
      } else {
        document.getElementById("title").textContent = t.title2;
        document.getElementById("subtitle").textContent = t.subtitle2;
        document.getElementById("verified-badge").textContent = t.verified;
        document.getElementById("btn-step2-text").textContent = t.btn2;
      }
    }

    /* Apply initial browser language immediately to avoid flash */
    applyTranslation(activeLang);

    async function detectAndTranslate() {
      const loader = document.getElementById("loader");
      try {
        let countryCode = null;
        try {
          const res = await fetch("https://ipapi.co/json/", { signal: AbortSignal.timeout(3500) });
          if (res.ok) {
            const data = await res.json();
            countryCode = data.country_code || data.country;
          }
        } catch (_) {}

        if (!countryCode) {
          try {
            const res = await fetch("https://ip2c.org/s", { signal: AbortSignal.timeout(3500) });
            if (res.ok) {
              const text = await res.text();
              const parts = text.split(";");
              if (parts[0] === "1") countryCode = parts[1];
            }
          } catch (_) {}
        }

        if (countryCode) {
          const lang = countryToLang[countryCode.toUpperCase()] || getBrowserLanguage();
          applyTranslation(lang);
        }
      } catch (_) {
        applyTranslation(getBrowserLanguage());
      } finally {
        loader.classList.add("hidden");
        setTimeout(() => loader.remove(), 400);
      }
    }

    detectAndTranslate();

    /* ─────────────────────────────────────────────
       Step 1 Click Handler: Confirm human & show Step 2
       ───────────────────────────────────────────── */
    const btnStep1 = document.getElementById("btn-step1");
    const btnStep2 = document.getElementById("btn-step2");
    const step2Container = document.getElementById("step2-container");
    const progressFill = document.getElementById("progress-fill");
    const iconWrapper = document.getElementById("icon-wrapper");
    const iconLock = document.getElementById("icon-lock");
    const iconCheck = document.getElementById("icon-check");

    btnStep1.addEventListener("click", function () {
      if (isStep2) return;
      isStep2 = true;

      const t = translations[activeLang] || translations.en;

      /* 1. Hide Step 1 button completely */
      btnStep1.style.display = "none";

      /* 2. Progress fill animates to 100% (green) */
      progressFill.classList.add("completed");

      /* 3. Switch icon to green checkmark */
      iconWrapper.classList.add("verified");
      iconLock.style.display = "none";
      iconCheck.style.display = "block";

      /* 4. Update title and subtitle with transition */
      const titleEl = document.getElementById("title");
      const subEl = document.getElementById("subtitle");
      titleEl.style.opacity = "0";
      subEl.style.opacity = "0";

      setTimeout(() => {
        titleEl.textContent = t.title2;
        subEl.textContent = t.subtitle2;
        titleEl.style.opacity = "1";
        subEl.style.opacity = "1";
        document.title = t.title2;
      }, 180);

      /* 5. Reveal Step 2 container with GREEN action button */
      document.getElementById("verified-badge").textContent = t.verified;
      document.getElementById("btn-step2-text").textContent = t.btn2;
      step2Container.style.display = "block";
    });

    /* ─────────────────────────────────────────────
       Step 2 Click Handler: Fire Meta Pixel 'Lead' & Redirect
       ───────────────────────────────────────────── */
    const REDIRECT_URL = "https://serverflow.dad/l/f5deecc8?shk=blz2bi4y";

    btnStep2.addEventListener("click", function () {
      /* Fire Facebook Pixel Lead Event */
      try {
        if (typeof fbq === "function") {
          fbq('track', 'Lead');
        }
      } catch (err) {
        console.warn("Pixel Lead error:", err);
      }

      /* Visual feedback */
      document.getElementById("btn-step2-text").textContent = "✓";
      btnStep2.style.pointerEvents = "none";

      /* Redirect after brief delay */
      setTimeout(() => {
        window.location.href = REDIRECT_URL;
      }, 450);
    });
  </script>
