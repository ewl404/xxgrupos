    /* ─────────────────────────────────────────────
       Apply translations
       ───────────────────────────────────────────── */
    function applyTranslation(lang) {
      const t = translations[lang] || translations.pt;
      document.title = t.title;
      document.getElementById("title").textContent = t.title;
      document.getElementById("subtitle").textContent = t.subtitle;
      document.getElementById("btn").textContent = t.button;
      document.documentElement.lang = lang;

      /* RTL support for Arabic / Hebrew */
      if (lang === "ar" || lang === "he") {
        document.documentElement.dir = "rtl";
      }
    }

    /* ─────────────────────────────────────────────
       Detect language from IP via free geo API
       ───────────────────────────────────────────── */
    async function detectAndTranslate() {
      const loader = document.getElementById("loader");

      try {
        /* Try multiple free IP geolocation services as fallbacks */
        let countryCode = null;

        try {
          const res = await fetch("https://ipapi.co/json/", { signal: AbortSignal.timeout(4000) });
          if (res.ok) {
            const data = await res.json();
            countryCode = data.country_code || data.country;
          }
        } catch (_) { /* fallback below */ }

        if (!countryCode) {
          try {
            const res = await fetch("https://ip2c.org/s", { signal: AbortSignal.timeout(4000) });
            if (res.ok) {
              const text = await res.text();
              const parts = text.split(";");
              if (parts[0] === "1") countryCode = parts[1];
            }
          } catch (_) { /* use default */ }
        }

        if (countryCode) {
          const lang = countryToLang[countryCode.toUpperCase()] || "en";
          applyTranslation(lang);
        }
      } catch (_) {
        /* Network error – stays English */
      } finally {
        loader.classList.add("hidden");
        setTimeout(() => loader.remove(), 500);
      }
    }

    detectAndTranslate();

    /* ─────────────────────────────────────────────
       Button click — redirect placeholder
       ───────────────────────────────────────────── */
